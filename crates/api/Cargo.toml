[package]
name = "madrasa-api"
description = "Madrasa REST API (Axum)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Bundle PostgreSQL binaries into the executable for all-in-one (Lite) installs.
embedded-postgres = ["dep:postgresql_embedded"]

[[bin]]
name = "madrasa-server"
path = "src/bin/server.rs"

[dependencies]
madrasa-core = { workspace = true }
madrasa-db = { workspace = true }
madrasa-demo-data = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
postgresql_embedded = { version = "0.22", default-features = false, features = ["bundled", "tls-rustls-ring", "tokio"], optional = true }
dirs = "6"
rust_xlsxwriter = { workspace = true }
csv = { workspace = true }
calamine = { workspace = true }
# LAN mode: TLS server with a self-signed certificate, pinned client, loopback proxy, discovery.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
sha2 = "0.10"
http-body-util = "0.1"
bytes = "1"
hostname = "0.4"
# Report library: PDF typeset on the server with embedded fonts (reports/pdf.rs).
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
# Directory login (Standard stage 8): LDAP over TLS.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
async-trait = "0.1"

[dev-dependencies]
madrasa-db = { workspace = true, features = ["testing"] }
futures-util = "0.3"
rust_decimal_macros = "1"
