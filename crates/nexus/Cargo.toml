[package]
name = "madrasa-nexus"
description = "Madrasa Nexus hub server: joins schools into one network (sync, reports, escrow)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "madrasa-nexus"
path = "src/bin/madrasa-nexus.rs"

[dependencies]
madrasa-core = { workspace = true }
madrasa-db = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true }
rust_xlsxwriter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
madrasa-db = { workspace = true, features = ["testing"] }
madrasa-demo-data = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
http-body-util = "0.1"
base64 = { workspace = true }
