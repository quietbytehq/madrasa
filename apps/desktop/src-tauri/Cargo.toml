[package]
name = "madrasa-desktop"
description = "Madrasa desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "madrasa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["embedded-postgres"]
# All-in-one install: bundle PostgreSQL into the app (Lite). Disable to require MADRASA_DATABASE_URL.
embedded-postgres = ["madrasa-api/embedded-postgres"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
madrasa-api = { workspace = true }
madrasa-db = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
