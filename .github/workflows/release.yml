name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the installers and uploads them as workflow artifacts without
  # creating a GitHub release (useful to hand a build to the pilot school before tagging).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  preflight:
    # Seconds of checking before an hour of building: the tag must match the version, and
    # Cargo.lock must match Cargo.toml (the hub image builds with `--locked`; v0.4.0-alpha
    # failed there because the version bump had not included Cargo.lock). Nothing is built
    # or published when this fails.
    name: Preflight (version and Cargo.lock)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          numeric="${release%%-*}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$numeric" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version; run scripts/set-version.sh $numeric first" >&2
            exit 1
          fi
      - name: Cargo.lock is up to date
        run: scripts/check-lockfile.sh

  build:
    name: Build (${{ matrix.os }})
    needs: [preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 so the bundles run on Debian 12/13 and Ubuntu 22.04 or newer
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache bundled PostgreSQL archive
        uses: actions/cache@v5
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
      - run: pnpm install --frozen-lockfile
      # The version the build reports comes from the tag (v0.1.3-alpha → 0.1.3-alpha); its
      # numeric part must match Cargo.toml, package.json and tauri.conf.json, which the app's
      # own unit test keeps in step with each other.
      - name: Version from the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          numeric="${release%%-*}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$numeric" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version; run scripts/set-version.sh $numeric first" >&2
            exit 1
          fi
          echo "MADRASA_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Building Madrasa $release"
      # Installers are unsigned for now (pre-alpha). Windows SmartScreen and Linux package
      # managers will warn; signing is tracked for a later milestone.
      - name: Build installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundles }}
      # The Linux bundles must run on Debian 12 and Ubuntu 22.04 (glibc 2.35/2.36): building on
      # ubuntu-22.04 links against glibc 2.35, and this check fails the job if anything newer
      # ever creeps in.
      - name: Check glibc requirement (Linux, manual run)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: |
          need=$(objdump -T target/release/madrasa-desktop | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "madrasa-desktop needs glibc $need"
          dpkg --compare-versions "$need" le 2.35
      - name: Upload installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: madrasa-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name == 'push'
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Madrasa ${{ github.ref_name }}"
          releaseBody: "Pre-alpha build. Unsigned installers; see docs/PROGRESS.md for what works."
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}

  parent-apk:
    # The parent app for Android (apps/parent), built by the same scripts as in CI. With the
    # four ANDROID_* secrets set it is signed with the release key; without them, with a
    # throwaway test key, and the file name and SIGNING.txt say so (docs/RELEASING.md).
    name: Parent app (Android APK)
    needs: [preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: pnpm install --frozen-lockfile
      - name: Name of the file
        id: apk
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "name=madrasa-parent-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=madrasa-parent-manual" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK
        run: scripts/build-parent-apk.sh
      - name: Sign it
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          scripts/sign-apk.sh dist-apk/madrasa-parent-unsigned.apk dist-apk "$APK_NAME"
          rm dist-apk/madrasa-parent-unsigned.apk
          mv dist-apk/SIGNING.txt "dist-apk/$APK_NAME-SIGNING.txt"
      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: madrasa-parent-apk
          path: dist-apk/*
          if-no-files-found: error

  attach-parent-apk:
    # The desktop build creates the draft release; this adds the parent app to it.
    name: Attach the parent app to the release
    if: github.event_name == 'push'
    needs: [build, parent-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: madrasa-parent-apk
          path: dist-apk
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-apk/* --clobber --repo "$GITHUB_REPOSITORY"

  manual:
    # The user manual in English and Urdu (docs/manual, scripts/build-manual.sh).
    name: User manual (EN and UR PDF)
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: manual
      - name: Build both PDFs
        run: scripts/build-manual.sh dist-manual
      - name: Upload the manual
        uses: actions/upload-artifact@v5
        with:
          name: madrasa-user-manual
          path: dist-manual/*.pdf
          if-no-files-found: error

  attach-manual:
    # The desktop build creates the draft release; this adds Madrasa-User-Manual-EN.pdf and
    # Madrasa-User-Manual-UR.pdf to it.
    name: Attach the user manual to the release
    if: github.event_name == 'push'
    needs: [build, manual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: madrasa-user-manual
          path: dist-manual
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist-manual/Madrasa-User-Manual-EN.pdf
          test -f dist-manual/Madrasa-User-Manual-UR.pdf
          gh release upload "$GITHUB_REF_NAME" dist-manual/Madrasa-User-Manual-EN.pdf dist-manual/Madrasa-User-Manual-UR.pdf --clobber --repo "$GITHUB_REPOSITORY"

  nexus-image:
    # The Madrasa Nexus hub image (hub and web console). A tagged release publishes it to
    # GitHub Container Registry as ghcr.io/quietbytehq/madrasa-nexus:<version> and :latest;
    # a manual run only builds it.
    name: Nexus hub image
    needs: [preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Version and tags
        id: image
        shell: bash
        run: |
          name="ghcr.io/quietbytehq/madrasa-nexus"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release="${GITHUB_REF_NAME#v}"
            echo "release=$release" >> "$GITHUB_OUTPUT"
            echo "tags=$name:$release,$name:latest" >> "$GITHUB_OUTPUT"
          else
            echo "release=" >> "$GITHUB_OUTPUT"
            echo "tags=$name:manual" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish on a tagged release)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/nexus/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            MADRASA_RELEASE=${{ steps.image.outputs.release }}
          cache-from: type=gha,scope=nexus-image
