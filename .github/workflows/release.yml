name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the installers and uploads them as workflow artifacts without
  # creating a GitHub release (useful to hand a build to the pilot school before tagging).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache bundled PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
      - run: pnpm install --frozen-lockfile
      # Installers are unsigned for now (pre-alpha). Windows SmartScreen and Linux package
      # managers will warn; signing is tracked for a later milestone.
      - name: Build installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: madrasa-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name == 'push'
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Madrasa ${{ github.ref_name }}"
          releaseBody: "Pre-alpha build. Unsigned installers; see docs/PROGRESS.md for what works."
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}
