name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the installers and uploads them as workflow artifacts without
  # creating a GitHub release (useful to hand a build to the pilot school before tagging).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 so the bundles run on Debian 12/13 and Ubuntu 22.04 or newer
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache bundled PostgreSQL archive
        uses: actions/cache@v5
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
      - run: pnpm install --frozen-lockfile
      # The version the build reports comes from the tag (v0.1.3-alpha → 0.1.3-alpha); its
      # numeric part must match Cargo.toml, package.json and tauri.conf.json, which the app's
      # own unit test keeps in step with each other.
      - name: Version from the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          release="${GITHUB_REF_NAME#v}"
          numeric="${release%%-*}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$numeric" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version; run scripts/set-version.sh $numeric first" >&2
            exit 1
          fi
          echo "MADRASA_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Building Madrasa $release"
      # Installers are unsigned for now (pre-alpha). Windows SmartScreen and Linux package
      # managers will warn; signing is tracked for a later milestone.
      - name: Build installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundles }}
      # The Linux bundles must run on Debian 12 and Ubuntu 22.04 (glibc 2.35/2.36): building on
      # ubuntu-22.04 links against glibc 2.35, and this check fails the job if anything newer
      # ever creeps in.
      - name: Check glibc requirement (Linux, manual run)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: |
          need=$(objdump -T target/release/madrasa-desktop | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "madrasa-desktop needs glibc $need"
          dpkg --compare-versions "$need" le 2.35
      - name: Upload installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: madrasa-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name == 'push'
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Madrasa ${{ github.ref_name }}"
          releaseBody: "Pre-alpha build. Unsigned installers; see docs/PROGRESS.md for what works."
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}
