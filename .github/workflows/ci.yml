name: CI

on:
  push:
    branches: ["main", "dev/**", "claude/**", "m1-**", "m2-**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # postgresql_embedded's build script uses the GitHub API; a token avoids rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The Nexus hub console: a second build of the same components.
      - run: pnpm build:console
      # The parent app's front end (apps/parent); its Android package is built separately.
      - run: pnpm build:parent

  rust-linux:
    name: Rust (Linux, with PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache bundled PostgreSQL archive
        uses: actions/cache@v5
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
      # The jobs below build without `--locked`, so they pass with a stale Cargo.lock; the
      # hub image does not. Say so here, by name.
      - name: Cargo.lock is up to date
        run: scripts/check-lockfile.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (embedded PostgreSQL feature)
        run: cargo clippy -p madrasa-api --features embedded-postgres --all-targets -- -D warnings
      - name: Tests (database-backed tests included)
        env:
          MADRASA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --workspace
      - name: Build server with bundled PostgreSQL
        run: cargo build -p madrasa-api --features embedded-postgres --bin madrasa-server

  rust-windows:
    # Windows runners have no service containers; database-backed tests skip themselves.
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache bundled PostgreSQL archive
        uses: actions/cache@v5
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build server with bundled PostgreSQL
        run: cargo build -p madrasa-api --features embedded-postgres --bin madrasa-server

  nexus-image:
    # The hub's container, on every pull request and every push: the real Dockerfile is
    # built the way the Release workflow builds it (same file, `--locked`, a release name
    # passed in), the Compose stack is started and a hub is set up and logged into over
    # HTTP. A change that would break the release image fails here first.
    name: Nexus hub image (build, Compose smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Seconds instead of minutes, and a plain message, for the commonest way to break
      # the image: a version bump that left Cargo.lock behind.
      - name: Cargo.lock matches the version
        run: scripts/check-lockfile.sh --quick
      - uses: docker/setup-buildx-action@v4
      - name: Build the hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/nexus/Dockerfile
          tags: madrasa-nexus:ci
          load: true
          # The Release workflow passes the tag here; CI passes a stand-in so the same
          # build path is exercised.
          build-args: |
            MADRASA_RELEASE=0.0.0-ci
          cache-from: type=gha,scope=nexus-image
          cache-to: type=gha,scope=nexus-image,mode=max
      - name: The image runs as a non-root user
        run: test "$(docker inspect -f '{{.Config.User}}' madrasa-nexus:ci)" = "10001"
      - name: Start the Compose stack
        working-directory: deploy/nexus
        env:
          NEXUS_IMAGE: madrasa-nexus:ci
          # Throwaway values for this job only.
          NEXUS_DB_PASSWORD: ciOnlyDatabasePassword
          NEXUS_SETUP_TOKEN: ci-only-setup-token
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test (health, console, setup, login)
        run: scripts/nexus-smoke.sh http://127.0.0.1:4780 ci-only-setup-token 0.0.0-ci
      - name: Compose logs
        if: always()
        working-directory: deploy/nexus
        env:
          NEXUS_IMAGE: madrasa-nexus:ci
          NEXUS_DB_PASSWORD: ciOnlyDatabasePassword
        run: docker compose logs --no-color | tail -n 80

  cloud-templates:
    # The Azure and Google Cloud templates for the hub are checked for errors here. They are
    # not deployed: no cloud account is used by CI.
    name: Cloud templates (Bicep build, Terraform validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Azure template builds
        run: |
          az bicep install
          az bicep build --file deploy/nexus/azure/main.bicep --outfile "$RUNNER_TEMP/nexus-azure.json"
      - name: Azure example parameters build
        env:
          # A throwaway value: the example file reads the password from the environment.
          NEXUS_DB_PASSWORD: ciOnlyNotARealPassword1234
        run: az bicep build-params --file deploy/nexus/azure/main.example.bicepparam --outfile "$RUNNER_TEMP/nexus-azure.parameters.json"
      - uses: hashicorp/setup-terraform@v4
      - name: Google Cloud module validates
        working-directory: deploy/nexus/gcp
        run: |
          terraform init -backend=false -input=false
          terraform validate


  parent-apk:
    # The parent app for Android (apps/parent), on every pull request and every push. The
    # Release workflow runs the same two scripts, so a change that would break the release
    # build fails here first. The package is signed with a throwaway test key: the release
    # key is used by the Release workflow only. The last step proves that the release-key
    # path of the signing script works, with a key made on the spot.
    name: Parent app (Android APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: pnpm install --frozen-lockfile
      - name: Build the APK
        run: scripts/build-parent-apk.sh
      - name: Sign it with a throwaway test key
        run: scripts/sign-apk.sh dist-apk/madrasa-parent-unsigned.apk dist-apk madrasa-parent-ci
      - name: The release-key path of the signing script works
        shell: bash
        run: |
          # A keystore made here stands in for the real one, passed the way the Release
          # workflow passes the secrets.
          ANDROID_KEYSTORE_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          export ANDROID_KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$RUNNER_TEMP/stand-in.p12" -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -alias madrasa -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI stand-in" >/dev/null 2>&1
          ANDROID_KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/stand-in.p12")
          export ANDROID_KEYSTORE_BASE64
          export ANDROID_KEY_ALIAS=madrasa
          scripts/sign-apk.sh dist-apk/madrasa-parent-unsigned.apk "$RUNNER_TEMP/release-path" madrasa-parent
          test -f "$RUNNER_TEMP/release-path/madrasa-parent.apk"
          grep -q "Signed with: the release key" "$RUNNER_TEMP/release-path/SIGNING.txt"
          rm -rf "$RUNNER_TEMP/stand-in.p12" "$RUNNER_TEMP/release-path"
      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: madrasa-parent-apk
          path: |
            dist-apk/madrasa-parent-ci-testkey.apk
            dist-apk/SIGNING.txt
          if-no-files-found: error

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: [frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 so the bundles run on Debian 12/13 and Ubuntu 22.04 or newer
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Cache bundled PostgreSQL archive
        uses: actions/cache@v5
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('.cargo/config.toml') }}
      - run: pnpm install --frozen-lockfile
      - name: Build installers (unsigned)
        run: pnpm --filter madrasa-desktop tauri build --bundles ${{ matrix.bundles }}
      # The Linux bundles must run on Debian 12 and Ubuntu 22.04 (glibc 2.36/2.35): building on
      # ubuntu-22.04 links against glibc 2.35, and this check fails the job if anything newer
      # ever creeps in.
      - name: Check glibc requirement (Linux)
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T target/release/madrasa-desktop | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "madrasa-desktop needs glibc $need"
          dpkg --compare-versions "$need" le 2.35
      # The .deb must bring what it needs: on a clean system, apt installs it together with
      # the libraries it declares (WebKitGTK and the rest), and the program then finds every
      # library it links. Not tried on this runner, which has them installed for the build.
      - name: The .deb installs with its dependencies on clean systems (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="$PWD/target/release/bundle/deb"
          deb=$(ls "$dir"/*.deb)
          echo "Depends: $(dpkg-deb -f "$deb" Depends)"
          for image in debian:12 ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v "$dir:/deb:ro" "$image" bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends /deb/*.deb > /dev/null
              if ldd /usr/bin/madrasa-desktop | grep "not found"; then exit 1; fi
              . /etc/os-release
              echo "installed with its dependencies on $PRETTY_NAME"'
          done
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: madrasa-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
